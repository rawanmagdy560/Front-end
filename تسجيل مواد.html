<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة تسجيل المواد</title>
    <style>
        /* تنسيقات أساسية للمحاكاة */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0; /* لون خلفية فاتح */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px; /* عرض مناسب للحاوية */
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* لضمان أن العرض يشمل الحشوة والحدود */
            text-align: right;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #d9534f; /* لون أحمر مشابه للزر في الصورة */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>صفحة تسجيل المواد</h2>
        
        <form action="#" method="POST"> 
            
            <div class="form-group">
                <label for="student_id">الرقم الجامعي:</label>
                <input type="text" id="student_id" name="student_id" required>
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="login-btn">تسجيل الدخول / استعراض</button>

            </form>
    </div>

</body>
</html>
