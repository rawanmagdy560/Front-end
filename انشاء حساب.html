<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل البيانات الشخصية</title>
  <style>
    body {
      font-family: "Segoe UI", "Almarai", sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      direction: rtl;
    }

    .card {
      background: rgb(240, 236, 236);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      width: 400px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 8px 0 9px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .back {
      text-align: center;
      margin-top: 10px;
    }

    .back a {
      color: #1473e6;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>صفحة تسجيل البيانات الشخصية</h2>
    <form>
        <h1>انشاء حساب </h1>
      <label>كود الطالب:</label>
      <input type="text" required>

      <label>اسم الطالب:</label>
      <input type="text" required>

      <label>النوع:</label>
      <select required>
        <option value="">اختر</option>
        <option value="ذكر">ذكر</option>
        <option value="أنثى">أنثى</option>
      </select>

      <label>رقم الهاتف:</label>
      <input type="tel" required>

      <label>العنوان:</label>
      <input type="text" required>

      <label>الإيميل:</label>
      <input type="email" required>
 
      
      <a href="تسجيل مواد.html">NEXT</a>
     
    </form>
    <div class="back">
      <a href="tset.html">العودة لتسجيل الدخول</a>
    </div>
  </div>
</body>
</html>
